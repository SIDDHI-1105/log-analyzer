# Production Docker Compose
# Use this for deploying on a server or local machine

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: loganalyzer-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-loganalyzer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - loganalyzer-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loganalyzer-backend
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-loganalyzer}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production-min-32-chars}
      - BACKEND_CORS_ORIGINS=["http://localhost","http://localhost:80","http://127.0.0.1","http://127.0.0.1:80"]
      - APP_NAME=Log Analyzer API
      - APP_VERSION=0.2.0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - loganalyzer-network
    restart: unless-stopped

  # Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loganalyzer-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - loganalyzer-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  loganalyzer-network:
    driver: bridge
